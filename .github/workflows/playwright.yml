name: Playwright tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Start Kanboard
        run: |
          docker run -d --name kanboard -p 8080:80 \
            -e API_TOKEN=${{ secrets.KANBOARD_API_TOKEN }} \
            -v ${{ github.workspace }}/docker/config.php:/var/www/app/data/config.php \
            kanboard/kanboard:latest
            
      - name: Wait for Kanboard
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/ > /dev/null && exit 0
            sleep 2
          done
          echo "Kanboard did not start in time"
          docker logs kanboard
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test
        env:
          KANBOARD_PASSWORD: admin
          BASE_URL: http://localhost:8080
          KANBOARD_API_TOKEN: ${{secrets.KANBOARD_API_TOKEN}}

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results (traces, screenshots)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7